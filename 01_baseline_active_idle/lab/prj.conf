# Lab 01 (M55) - console output plus the onboard SW8 button as a plain GPIO.
#
# SW8 is read directly via the GPIO driver (gpio_pin_get_dt()), not through
# Zephyr's input/gpio-keys subsystem -- that subsystem had a confirmed
# driver bug in this SDK (see main.c and the troubleshooting doc, issues
# 4-6), so CONFIG_INPUT/CONFIG_INPUT_GPIO_KEYS are not needed here.

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_GPIO=y
CONFIG_I2C=y

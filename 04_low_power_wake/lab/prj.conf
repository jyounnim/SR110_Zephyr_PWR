# Lab 04 (M55) - console output plus hwinfo for the reset-cause check.
# No watchdog, no I2C, no mbox in this lab -- SW7 is a PMU-level trigger
# with no devicetree/software surface, so there is nothing else to enable.

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_HWINFO=y

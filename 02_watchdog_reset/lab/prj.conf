# Lab 02 (M55) - console output plus the M55 watchdog (wdog0).
#
# CONFIG_WATCHDOG enables the wdt_* driver API. CONFIG_HWINFO enables
# hwinfo_get_reset_cause()/hwinfo_clear_reset_cause(), used at boot to
# detect whether this boot was caused by the watchdog.

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
